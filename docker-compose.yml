x-backend:
  &backend
  build: ./backend
  restart: unless-stopped
  environment:
    DATABASE_URL: postgresql+psycopg2://pulse:pulse@db:5432/pulse
    REDIS_URL: redis://redis:6379/0
    FETCH_INTERVAL_MINUTES: "5"
    USE_FINBERT: "true"
    FETCH_FULL_TEXT: "true"
    SECRET_KEY: ${SECRET_KEY:-dev-only-change-me}
    GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  volumes:
    - hfcache:/root/.cache/huggingface
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: pulse
      POSTGRES_DB: pulse
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U pulse"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6381:6379"
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 5s
      retries: 10

  api:
    <<: *backend
    command: uvicorn app.main:api --host 0.0.0.0 --port 8000
    ports:
      - "8001:8000"

  worker:
    <<: *backend
    command: celery -A app.celery_app:celery worker --loglevel=info --concurrency=1

  beat:
    <<: *backend
    command: celery -A app.celery_app:celery beat --loglevel=info

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev"
    environment:
      API_PROXY: http://api:8000
      VITE_POLL: "1"
    ports:
      - "5174:5173"
    depends_on:
      - api

volumes:
  pgdata:
  hfcache:
  node_modules:
